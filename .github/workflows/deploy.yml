      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
    
    # Railway example
    - name: Deploy to Railway  
      uses: railwayapp/action@v1
      with:
        railwayToken: ${{ secrets.RAILWAY_TOKEN }}
        serviceId: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        source: frontend/
    
